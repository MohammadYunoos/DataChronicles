name: Build and deploy Data Chronicles to Azure App Service

# Deploys the single App Service package (React UI bundled into the .NET API's wwwroot).
# Set up via:  App Service → Deployment Center → GitHub  (this file is what it runs),
# or commit it manually and add the publish-profile secret below.

on:
  push:
    branches: [ main ]
  workflow_dispatch:        # allow manual runs from the Actions tab

env:
  AZURE_WEBAPP_NAME: app-datachronicles-u2a           # <-- change to your Web App name
  DOTNET_VERSION: '9.0.x'
  NODE_VERSION: '20.x'
  API_PROJECT: backend/DataChronicles.Api/DataChronicles.Api.csproj

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- Frontend (React + Vite) ----
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build React UI
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # ---- Backend (.NET 9) ----
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish API
        run: dotnet publish ${{ env.API_PROJECT }} -c Release -o publish

      # ---- Bundle UI into the API's wwwroot (single App Service hosts both) ----
      - name: Bundle UI into wwwroot
        run: |
          mkdir -p publish/wwwroot
          cp -r frontend/dist/* publish/wwwroot/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: publish

      # ---- Deploy to Azure App Service ----
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish
