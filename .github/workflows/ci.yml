name: CI — scan and coverage

# Quality gate for Data Chronicles (separate from deploy):
#   1. Static scan  — build the API with .NET analyzers + Security Code Scan as errors.
#   2. Coverage gate — run tests, fail if total line coverage < 80%, publish a report.
# No external services, accounts, or secrets required.

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '9.0.x'
  API_PROJECT: backend/DataChronicles.Api/DataChronicles.Api.csproj
  TEST_PROJECT: backend/DataChronicles.Tests/DataChronicles.Tests.csproj

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # 1) Static analysis — analyzers + Security Code Scan promoted to errors.
      - name: Static scan (analyzers as errors)
        run: dotnet build ${{ env.API_PROJECT }} -c Release -warnaserror

      # 2) Tests + coverage gate — fails if total line coverage < 80%.
      - name: Test with coverage gate
        run: >
          dotnet test ${{ env.TEST_PROJECT }} -c Release
          /p:CollectCoverage=true
          /p:CoverletOutputFormat=cobertura
          /p:CoverletOutput=${{ github.workspace }}/coverage/coverage.cobertura.xml
          /p:Threshold=80 /p:ThresholdType=line /p:ThresholdStat=total

      # 3) Human-readable coverage report.
      - name: Generate coverage report
        if: always()
        uses: danielpalme/ReportGenerator-GitHub-Action@5
        with:
          reports: coverage/coverage.cobertura.xml
          targetdir: coveragereport
          reporttypes: MarkdownSummaryGithub;Html

      - name: Publish coverage to job summary
        if: always()
        run: cat coveragereport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coveragereport
