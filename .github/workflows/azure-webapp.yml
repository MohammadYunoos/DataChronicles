name: Build and deploy Data Chronicles to Azure App Service

# Deploys the single App Service package (React UI bundled into the .NET API's wwwroot).
# Auth: publish profile (SCM basic-auth publishing must be enabled on the Web App).
# Required GitHub secret: AZURE_WEBAPP_PUBLISH_PROFILE
#   Web App → Overview → "Download publish profile", then add its full contents as the secret.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: app-datachronicles-u2a        # <-- must match the App Service RESOURCE name (Portal → Overview → Name)
  DOTNET_VERSION: '9.0.x'
  NODE_VERSION: '20.x'
  API_PROJECT: backend/DataChronicles.Api/DataChronicles.Api.csproj

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- Frontend (React + Vite) ----
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build React UI
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # ---- Backend (.NET 9) ----
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish API
        run: dotnet publish ${{ env.API_PROJECT }} -c Release -o publish

      # ---- Bundle UI into the API's wwwroot (single App Service hosts both) ----
      - name: Bundle UI into wwwroot
        run: |
          mkdir -p publish/wwwroot
          cp -r frontend/dist/* publish/wwwroot/

      # ---- Deploy to Azure App Service ----
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish
