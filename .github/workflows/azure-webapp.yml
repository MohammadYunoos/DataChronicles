name: Build and deploy Data Chronicles to Azure App Service

# Builds the single App Service package (React UI bundled into the .NET API's wwwroot) ONCE,
# then deploys it to the primary and DR App Services IN PARALLEL so the two regions never drift.
# Auth: publish profiles (SCM basic-auth publishing must be enabled on each Web App).
# Required GitHub secrets (Web App → Overview → "Download publish profile" → paste full contents):
#   AZURE_WEBAPP_PUBLISH_PROFILE      → app-datachronicles-u2a (primary)
#   AZURE_WEBAPP_PUBLISH_PROFILE_DR   → app-datachronicles-dr  (DR / secondary region)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '9.0.x'
  NODE_VERSION: '20.x'
  API_PROJECT: backend/DataChronicles.Api/DataChronicles.Api.csproj

jobs:
  # ---- Build the deployable package once, publish it as an artifact ----
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- Frontend (React + Vite) ----
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build React UI
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # ---- Backend (.NET 9) ----
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish API
        run: dotnet publish ${{ env.API_PROJECT }} -c Release -o publish

      # ---- Bundle UI into the API's wwwroot (single App Service hosts both) ----
      - name: Bundle UI into wwwroot
        run: |
          mkdir -p publish/wwwroot
          cp -r frontend/dist/* publish/wwwroot/

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-package
          path: publish

  # ---- Deploy the same package to both App Services concurrently ----
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false        # one region failing must not cancel the other
      matrix:
        include:
          - app: app-datachronicles-u2a          # primary
            profile: AZURE_WEBAPP_PUBLISH_PROFILE
          - app: app-datachronicles-dr           # DR / secondary region
            profile: AZURE_WEBAPP_PUBLISH_PROFILE_DR

    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: app-package
          path: publish

      - name: Deploy to ${{ matrix.app }}
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ matrix.app }}
          publish-profile: ${{ secrets[matrix.profile] }}
          package: publish
